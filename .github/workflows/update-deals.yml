name: Atualizar radar de passagens

on:
  schedule:
    # GitHub Actions usa UTC. 09:17 e 21:17 UTC = 06:17 e 18:17 em Brasília (UTC-3).
    - cron: '17 9,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-ferias-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Consultar Travelpayouts e atualizar JSON
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: node scripts/fetch-deals.mjs

      - name: Publicar novos dados no repositório
        shell: bash
        run: |
          if git diff --quiet -- data/deals.json data/history.json; then
            echo "Nenhuma alteração nos arquivos de dados."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deals.json data/history.json
          git commit -m "chore: atualizar radar de passagens"
          git push
